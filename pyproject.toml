[project]
name = "oemmatinsightbi"
version = "0.0.0"
description = "Microsoft Fabric medallion BI solution for OEM procurement material sourcing analysis."
requires-python = ">=3.10"
dependencies = []

# ---------------------------------------------------------------------------
# NOT AN INSTALLABLE PACKAGE — deliberately.
#
# `tests/` imports `from src.transformations...`, which resolves because
# `tests/__init__.py` exists and pytest therefore puts the REPO ROOT on
# sys.path. Adding a build backend would install `src/` into the venv and
# change that resolution — the tests would then import the *installed* copy
# rather than the working tree, which silently breaks the src/-vs-notebook
# parity contract (`tests/` loads each notebook's own functions via
# `load_notebook_functions` and pins them against `src/`; see root CLAUDE.md).
#
# So this file exists purely to manage the interpreter and the dev
# dependencies. `uv run pytest` is the entry point.
# ---------------------------------------------------------------------------
[tool.uv]
package = false

[dependency-groups]
dev = [
    # PINNED EXACTLY, not ranged. The previous `pyspark>=4.0.0,<5.0.0` in
    # requirements-test.txt allowed 4.2.0 to resolve while every doc in this
    # repo — root CLAUDE.md § Gotchas, tests/conftest.py, the DQ framework —
    # describes 4.0.1 as *the* verification runtime and reasons about its
    # specific cast/ANSI semantics. A floating range means a fresh `uv sync`
    # can change transformation behaviour with no diff to explain it, which is
    # the exact failure mode this project's hazard list is built around.
    # Bump this deliberately, and re-check the ANSI note in conftest.py when
    # you do.
    "pyspark==4.0.1",
    "pytest>=8.0.0",
    "pytest-html>=4.1.0",
    # tests/test_wgi_retry.py pins bronze_ingest_wgi's retry classifier against the
    # REAL requests exception hierarchy (task-066). Substituting a hand-rolled fake
    # hierarchy would defeat the point: the bug class these tests guard is exactly a
    # pattern list written from imagination that never met live output
    # (test_error_categorization.py's docstring records the last time that happened).
    # Ranged, not pinned: unlike pyspark, no transformation semantics depend on the
    # version — only the exception class names, stable since requests 2.x.
    "requests>=2.31",
]

# Separate group, NOT installed by default — `uv run --group lint black src/ tests/`.
# Matches what test.yml's code-quality job installs. Kept out of `dev` so the
# common path (`uv run pytest`) does not pay for three linters it never calls.
#
# Deliberately NOT including pytest-cov: nothing in CI consumes coverage, and
# README/CONTRIBUTING previously advertised `--cov` flags that simply errored.
# Add it here first if you want coverage, rather than documenting it as working.
lint = [
    "black",
    "flake8",
    "pylint",
]
