# =============================================================================
# fabric/parameter.yml — environment-specific configuration for fabric-cicd
# =============================================================================
#
# This file is consumed by Microsoft's `fabric-cicd` Python library at deploy
# time. The same Fabric artifact definitions (notebooks + orchestrator pipeline)
# deploy to every environment unchanged; fabric-cicd applies the find/replace
# and key/value replacements below to swap environment-bound values per target.
#
# Schema: fabric-cicd parameterization schema (top-level keys: find_replace,
# key_value_replace, spark_pool, semantic_model_binding). Authored against
# fabric-cicd v1.2.0 (installed locally; validated via
# `fabric_cicd._parameter._utils.validate_parameter_file`) and cross-checked
# against the official parameterization docs:
#   https://github.com/microsoft/fabric-cicd/blob/main/docs/how_to/parameterization.md
#
# ----------------------------------------------------------------------------
# VALUES THAT MUST CHANGE PER ENVIRONMENT (and where they come from)
# ----------------------------------------------------------------------------
# Each entry below has a `DEV` value (the current single portfolio workspace)
# and a commented `# PROD:` placeholder. To add a second environment:
#   1. Uncomment the `PROD:` line and fill in the prod value; OR add a new
#      environment key (e.g. `PPE:`) alongside `DEV:`.
#   2. Set the same environment string on the `FabricWorkspace` object in the
#      deploy workflow (`.github/workflows/deploy-fabric.yml`, task-045).
#
# Value sources (per environment):
#   * Workspace ID  — Fabric workspace URL: app.fabric.microsoft.com/groups/<id>
#                     or Workspace → Settings → Information.
#   * Lakehouse ID  — Lakehouse item settings (or workspace URL when the
#                     lakehouse is open). The notebook META blocks embed it as
#                     `default_lakehouse` / `default_lakehouse_workspace_id` /
#                     lakehouse `id`. The orchestrator pipeline stores the SAME
#                     lakehouse under a reordered byte-group form in
#                     `linkedService.artifactId` — that form is parameterised
#                     separately below.
#   * Connection IDs — list them via the Fabric REST API; the GUID is NOT shown
#                     in the portal URL and the connection's Settings pane does
#                     not surface it either (verified 2026-07-31 — the older
#                     "it's in the URL" note here was wrong and cost a round):
#                       az account set --subscription "N/A(tenant level account)"
#                       TOK=$(az account get-access-token \
#                         --resource https://api.fabric.microsoft.com \
#                         --query accessToken -o tsv)
#                       curl -s -H "Authorization: Bearer $TOK" \
#                         https://api.fabric.microsoft.com/v1/connections
#                     Match on displayName. The `az account set` line matters:
#                     this tenant has two accounts and only the tenant-level
#                     `fabricuser@…onmicrosoft.com` one has Fabric access.
#                     Do NOT pass --allow-no-subscriptions to get-access-token;
#                     it is a valid flag for `az login` only and errors here.
#                     Connections are environment-bound (each workspace owns
#                     its own), so every entry below needs a per-env value.
#   * Notebook / Dataflow IDs — NOT listed here. They are resolved automatically
#                     by fabric-cicd via the `$items.<Type>.<displayName>.$id`
#                     dynamic variable in `key_value_replace` below, so a second
#                     environment needs no extra entry — fabric-cicd looks up
#                     the target workspace's item ID by display name.
#
# ----------------------------------------------------------------------------
# KNOWN LIMITATION — DATAFLOW GEN2 CREDENTIALS DO NOT SURVIVE A PUBLISH
# ----------------------------------------------------------------------------
# `fabric-cicd` deploys item DEFINITIONS only. A Dataflow Gen2 stores its source
# credential INSIDE the dataflow definition, and the publish strips it — so every
# automated deploy leaves the dataflow deployed-but-unbound, and it fails at
# runtime. Parameterising connection IDs in this file does NOT fix it.
#
# WHERE THE GEN2 CREDENTIAL ACTUALLY LIVES (verified 2026-07-31 — two earlier
# guesses in this file were wrong and each cost a diagnostic round):
#   * NOT tenant Settings → Manage connections and gateways → Data sources.
#     Editing credentials there does not attach to the dataflow.
#   * NOT the source step's gear dialog. That dialog is "SQL Server database"
#     with Server/Database/Advanced only — no connection picker, no credentials.
#   * It is bound inside the DATAFLOW EDITOR itself, which is precisely what the
#     publish strips.
#
# Applies to `EPI_file2table` and `WGI_file2table`, which are still Dataflow Gen2
# items. Re-bind them in the dataflow editor after any deploy that touches them.
# (task-035 moved the pipeline's EPI/WGI ingestion to notebooks, so these two no
# longer sit on the orchestrator's critical path — but the items still exist and
# the gotcha still applies if they are refreshed.)
#
# `bronze_azureSQLdb2table` was RETIRED for exactly this reason (task-048): on top
# of the credential stripping, an SPN cannot refresh a Dataflow Gen2 at all
# (`SPNBasedRefreshNotAllowed`). Both failure modes recurred on EVERY automated
# deploy. Snapshot: .claude/support/retired/bronze-azuresqldb2table-dataflow/
#
# THE REPLACEMENT PATTERN — COPY ACTIVITY, NOT DATAFLOW
# ----------------------------------------------------------------------------
# A Copy activity keeps its credential in Fabric's own CONNECTION STORE, outside
# the item definition, so a publish does not strip it and an SPN can run it. This
# is the pattern already proven green under the SPN by bronze_copy_eu_supply_shares
# and bronze_copy_global_supply_shares.
#
# The one manual prerequisite: the connection must be SHARED with the SPN's
# security group, or the publish fails with "User does not have access to the
# connection used in the Pipeline" (this took the first real publish to 15/16).
# Share via the portal (Manage connections and gateways → Connections → … →
# Manage users → add `Fabric-SPN-Access` as User) or via REST:
#   POST /v1/connections/{connectionId}/roleAssignments
#   {"principal":{"id":"<group-object-id>","type":"Group"},"role":"User"}
# Verify with GET on the same path — expect the group alongside the Owner entry.
# Reference: project memory — "fabric-cicd pipeline connection sharing".
#
# =============================================================================
# No secrets or credentials appear in this file. Connection IDs are GUIDs, not
# secrets. Service Principal credentials (client ID / secret / tenant ID) live
# in GitHub repository secrets, never in this file.
# =============================================================================

find_replace:
    # ----- Workspace ID (every notebook META block + pipeline_error_handler.WORKSPACE_ID) -----
    - find_value: "99e4cc6d-6ec3-49a7-aed9-b69b04a97aa9"
      replace_value:
          DEV: "99e4cc6d-6ec3-49a7-aed9-b69b04a97aa9"
          # PROD: "<prod-workspace-id>"   # TODO: prod workspace GUID

    # ----- Lakehouse ID (oem_lh) — canonical form in notebook META blocks -----
    - find_value: "488fb9f8-e635-4683-90c4-ba4fee9dfadb"
      replace_value:
          DEV: "488fb9f8-e635-4683-90c4-ba4fee9dfadb"
          # PROD: "<prod-lakehouse-id>"   # TODO: prod oem_lh lakehouse GUID

    # ----- Lakehouse artifactId — reordered byte-group form used in pipeline linkedService -----
    # Fabric stores the lakehouse GUID in a different byte-group order inside
    # DataPipeline `linkedService.typeProperties.artifactId`. This is the SAME
    # lakehouse as above, so in prod the two forms must both be filled in
    # (derive the artifactId form from the prod lakehouse ID, or read it from
    # the deployed pipeline's linkedService JSON).
    - find_value: "ee9dfadb-ba4f-90c4-4683-e635488fb9f8"
      replace_value:
          DEV: "ee9dfadb-ba4f-90c4-4683-e635488fb9f8"
          # PROD: "<prod-lakehouse-artifactId>"   # TODO: reordered form of prod lakehouse ID

    # ----- HttpServer connection — EU Supply CSV source (bronze_EUSupplyShares copy activity) -----
    - find_value: "97124587-4fe9-43ee-bd6c-6a0fe3bc5664"
      replace_value:
          DEV: "97124587-4fe9-43ee-bd6c-6a0fe3bc5664"
          # PROD: "<prod-eu-httpserver-connection-id>"   # TODO

    # ----- HttpServer connection — Global Supply CSV source (bronze_GlobalSupplyShares copy activity) -----
    - find_value: "172b089e-bb4a-4615-94fb-beef5019fca7"
      replace_value:
          DEV: "172b089e-bb4a-4615-94fb-beef5019fca7"
          # PROD: "<prod-global-httpserver-connection-id>"   # TODO

    # ----- SQL connection — Azure SQL procurement source -----
    # Used by BOTH bronze_copy_procurement_transactional and bronze_copy_supplier_ref.
    # Added by task-048, which retired the bronze_azureSQLdb2table dataflow; this
    # connection is what replaced it. Display name: oem_azuresql_procurement,
    # path procurement-supplier.database.windows.net;procurement-supplier-db.
    # A PROD value must be a connection that ALREADY EXISTS in the target tenant
    # AND is shared with that environment's deploy SPN group — fabric-cicd does
    # not create connections, and an unshared connection fails the publish with
    # "User does not have access to the connection used in the Pipeline".
    - find_value: "da9667d6-9df0-492e-83e0-de4a55fc388e"
      replace_value:
          DEV: "da9667d6-9df0-492e-83e0-de4a55fc388e"
          # PROD: "<prod-azuresql-connection-id>"   # TODO

key_value_replace:
    # Notebook / dataflow IDs referenced by the orchestrator pipeline. The
    # `$items.<Type>.<displayName>.$id` dynamic variable resolves to the
    # target environment's item ID automatically, so `_ALL_` covers every
    # environment and no per-env entry is needed.
    - find_key: $.properties.activities[?(@.name=="bronze_to_silver_cleaning")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.bronze-to-silver.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    - find_key: $.properties.activities[?(@.name=="silver_to_gold")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.silver-to-gold2.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    - find_key: $.properties.activities[?(@.name=="bronze_epi")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.bronze_ingest_epi.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    - find_key: $.properties.activities[?(@.name=="bronze_wgi")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.bronze_ingest_wgi.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    - find_key: $.properties.activities[?(@.name=="data_quality_checks")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.data_quality_checks.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    - find_key: $.properties.activities[?(@.name=="pipeline_error_handler")].typeProperties.notebookId
      replace_value:
          _ALL_: "$items.Notebook.pipeline_error_handler.$id"
      item_type: "DataPipeline"
      item_name: "orchestrator_pipeline_bronze_to_gold"

    # NOTE: there is deliberately no entry here for the procurement bronze load.
    # It used to be a RefreshDataflow activity (`bronze_procurement`) whose
    # dataflowId was resolved via $items.Dataflow.bronze_azureSQLdb2table.$id.
    # task-048 retired that dataflow and replaced it with two Copy activities,
    # so the JSONPath no longer matches anything. A Copy activity binds to a
    # CONNECTION, not to a workspace item, and connections are parameterised by
    # GUID under `find_replace` above — see the oem_azuresql_procurement entry.