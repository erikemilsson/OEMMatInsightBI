[pytest]
# Pytest configuration for OEMMatInsightBI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for categorizing tests (only markers actually applied in tests/)
markers =
    unit: Unit tests for individual functions

# Logging — live capture only; no DEBUG log file written to disk
log_cli = false
log_cli_level = INFO