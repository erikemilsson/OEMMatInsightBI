name: Deploy Fabric Artifacts

# =============================================================================
# Deploy Fabric artifact definitions (fabric/) to the OEMMatInsightBI workspace
# via Microsoft's fabric-cicd Python library.
#
# Trigger model (push-to-main real publish enabled 2026-08-01, task-046):
#   * push to main        -> REAL PUBLISH via fabric-cicd publish_all_items.
#                            Enabled 2026-08-01 after task-046 validated the
#                            end-to-end deploy path. The commit-ordering
#                            convention (Fabric -> local -> Update) still holds:
#                            commit here only after UI changes are saved, so an
#                            automated push never races in-flight UI work.
#   * workflow_dispatch   -> manual. `publish: true` does the real
#                            fabric-cicd publish; otherwise dry-run.
#
# Push-to-main real publish was enabled 2026-08-01 after task-046 (owner: both)
# validated end-to-end. See git history for the prior dry-run guard.
#
# Auth: Azure AD Service Principal (registered in task-043) via GitHub repo
# secrets. The workflow exports the secrets to the env vars azure-identity's
# ClientSecretCredential reads. No credentials appear inline.
#
# fabric-cicd API reference: v1.2.0 (installed locally; signatures verified
# against the installed package, not memory). Construction of FabricWorkspace
# validates parameter.yml and authenticates; publish_all_items performs the
# real publish. Dry-run = construct + read-only refresh, skip publish.
# Docs: https://github.com/microsoft/fabric-cicd/blob/main/docs/how_to/parameterization.md
# =============================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (resolve + report, no publish). Ignored when publish is true.'
        type: boolean
        default: true
      publish:
        description: 'Publish to the live workspace (overrides dry_run).'
        type: boolean
        default: false

# Default secrets-based auth has nothing to write back to the repo; the GITHUB
# token is not used for deployment. Keep permissions minimal.
permissions:
  contents: read

env:
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # Push to main is REAL PUBLISH (enabled 2026-08-01, task-046 validated).
  # workflow_dispatch publishes only when the caller sets `publish: true`.
  EFFECTIVE_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'false' || 'true' }}

jobs:
  deploy:
    name: fabric-cicd deploy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # Still no `cache: pip`, but the reason changed on 2026-08-12.
        #
        # A pyproject.toml now EXISTS, so `cache: pip` would find it and stop
        # erroring — but it would key the cache on a file that has nothing to do
        # with what this job installs. pyproject.toml declares the TEST runtime
        # (pyspark, pytest); this job installs fabric-cicd + azure-identity,
        # which appear in it nowhere. The cache would be invalidated by pyspark
        # bumps and unaffected by a fabric-cicd bump — precisely backwards.
        #
        # This job is also deliberately NOT on uv (test.yml is). It installs two
        # pinned packages and needs no interpreter management; adding a
        # dependency-resolution layer to the deploy path would put publish
        # reliability behind a lockfile for no benefit.

    - name: Install fabric-cicd
      run: |
        python -m pip install --upgrade pip
        pip install "fabric-cicd==1.2.0" azure-identity

    - name: Report run mode
      run: |
        echo "::notice::Event=${{ github.event_name }}  dry_run=${EFFECTIVE_DRY_RUN}"
        if [ "${EFFECTIVE_DRY_RUN}" = "true" ]; then
          echo "MODE: DRY-RUN (resolve parameter.yml + enumerate items, no publish)"
        else
          echo "MODE: PUBLISH (fabric-cicd publish_all_items will run against the live workspace)"
        fi

    - name: Deploy (fabric-cicd)
      env:
        DRY_RUN: ${{ env.EFFECTIVE_DRY_RUN }}
      run: |
        python - <<'PY'
        import os
        import sys
        import pathlib
        import json

        from azure.identity import ClientSecretCredential
        from fabric_cicd import FabricWorkspace, publish_all_items

        workspace_id   = os.environ["FABRIC_WORKSPACE_ID"]
        client_id      = os.environ["AZURE_CLIENT_ID"]
        client_secret  = os.environ["AZURE_CLIENT_SECRET"]
        tenant_id      = os.environ["AZURE_TENANT_ID"]
        repository_dir = str(pathlib.Path("fabric").resolve())
        environment    = "DEV"
        dry_run        = os.environ.get("DRY_RUN", "true").lower() == "true"

        # Item types in scope for this workspace. Matches fabric/parameter.yml
        # (task-044) and the spec's Phase 4 deliverable list. Names must match
        # fabric_cicd.ItemType enum values exactly.
        #
        # "Dataflow" and "Warehouse" were REMOVED 2026-08-10. The repo no longer
        # contains any item of either type: the last two Dataflow Gen2 items
        # (EPI_file2table, WGI_file2table) and the oem_wh Warehouse were retired
        # that day. Keeping them in scope was not free — it made every deploy
        # republish dead items, and each Dataflow publish stripped their Gen2
        # credentials (see fabric/parameter.yml). Re-add a type here only when a
        # real item of that type returns to fabric/.
        # Snapshots: .claude/support/retired/epi-wgi-file2table-dataflows/
        #            .claude/support/retired/oem-wh-warehouse/
        item_type_in_scope = [
            "Notebook",
            "DataPipeline",
            "SemanticModel",
            "Lakehouse",
            "Report",
        ]

        # fabric/archive/ is currently EMPTY. It once held retired items (the old
        # `report` and `semantic_model_oeminsightbi`) that Fabric's git sync
        # committed when they were archived in the UI; both were deleted
        # 2026-08-01 by workspace-sync commit d128664 (recoverable at d128664~1).
        # The exclude is retained deliberately: fabric-cicd's repository scan
        # (os.walk) recurses into archive/, so anything archived there in future
        # would otherwise be RE-DEPLOYED to the live workspace. publish_all_items
        # honors publish_folder_path_exclude_regex (ancestor walk), so this
        # makes the real publish skip them. The regex matches the item's
        # folder_path, which for an item directly under archive/ is "/archive".
        folder_exclude_regex = r"^/archive$"

        print(f"workspace_id        = {workspace_id}")
        print(f"repository_directory= {repository_dir}")
        print(f"environment         = {environment}")
        print(f"item_type_in_scope  = {item_type_in_scope}")
        print(f"folder_exclude_regex = {folder_exclude_regex}")
        print(f"dry_run             = {dry_run}")

        # Authenticate as the Service Principal. ClientSecretCredential is the
        # token_credential fabric-cicd's FabricWorkspace expects (verified
        # against the installed 1.2.0 __init__ signature).
        token_credential = ClientSecretCredential(
            client_id=client_id,
            client_secret=client_secret,
            tenant_id=tenant_id,
        )

        # Construction authenticates, resolves/validates the workspace, and
        # loads + validates fabric/parameter.yml (raises ParameterFileError on
        # an invalid file). It does NOT publish or modify the workspace.
        workspace = FabricWorkspace(
            workspace_id=workspace_id,
            repository_directory=repository_dir,
            item_type_in_scope=item_type_in_scope,
            environment=environment,
            token_credential=token_credential,
        )
        # Exclude retired items under fabric/archive/ from publish (see comment
        # above). Set after construction; __init__ defaults it to None.
        workspace.publish_folder_path_exclude_regex = folder_exclude_regex

        # Read-only enumeration of what would be published (repo) and what is
        # already in the workspace (deployed). These are private helpers but
        # they perform only filesystem reads + a GET to the items API; they do
        # not mutate the workspace.
        #
        # KNOWN LIMITATION (deliberate, verified against fabric-cicd 1.2.0 on
        # 2026-08-02): the library exposes no public dry-run/resolve-only API.
        # publish_all_items() has no dry_run flag and there is no resolve /
        # preview / plan module, so these underscore-prefixed helpers are the
        # only way to enumerate a deployment plan without publishing. They are
        # therefore an accepted coupling to private API surface, not an
        # oversight. The try/except below keeps a helper rename from failing
        # the workflow — dry-run degrades to an incomplete plan with a warning
        # rather than a hard error.
        #
        # UPGRADE TRIGGER: when bumping fabric-cicd, re-check whether a public
        # dry-run or resolve-only entry point has shipped; if so, replace this
        # block with it and drop the try/except. (Tracked as task-047, closed
        # won't-do 2026-08-02 — the criterion was gated on a library release
        # that may never come, so the trigger lives here at the call site.)
        #
        # NOTE: _refresh_repository_items does NOT honor the folder-exclude
        # regex (it walks every .platform under repository_directory), so the
        # raw repository_items still contains the 2 archived items. The dry-run
        # preview below filters them with the same regex so the reported plan
        # matches what publish_all_items would actually deploy.
        try:
            workspace._refresh_repository_items()
            workspace._refresh_deployed_items()
        except Exception as exc:  # noqa: BLE001 - dry-run must still report
            print(f"::warning::Read-only refresh failed; dry-run enumeration incomplete: {exc}")

        import re as _re

        def _summarize(label, items, exclude_regex=None):
            print(f"::group::{label}")
            count = 0
            for item_type in sorted(items):
                names = sorted(items[item_type])
                for name in names:
                    item = items[item_type][name]
                    if exclude_regex and getattr(item, "folder_path", ""):
                        if _re.search(exclude_regex, item.folder_path):
                            continue
                    print(f"  {item_type}/{name}")
                    count += 1
            print(f"  total: {count}")
            print("::endgroup::")
            return count

        repo_count     = _summarize(
            "Repository items (would be published)",
            workspace.repository_items,
            exclude_regex=folder_exclude_regex,
        )
        deployed_count = _summarize("Currently deployed items in workspace",  workspace.deployed_items)

        if dry_run:
            print(
                "::notice::DRY-RUN complete. parameter.yml validated, "
                f"{repo_count} repository items resolved, "
                f"{deployed_count} items currently deployed. No publish performed."
            )
            sys.exit(0)

        print("::notice::PUBLISH mode: invoking fabric_cicd.publish_all_items against the live workspace.")
        publish_all_items(workspace)
        print("::notice::publish_all_items completed.")

        # Persist a small deploy summary as a step output artifact for audit.
        summary_path = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", ".")) / "fabric-deploy-summary.json"
        summary_path.write_text(
            json.dumps(
                {
                    "mode": "publish",
                    "workspace_id": workspace_id,
                    "environment": environment,
                    "repository_items": repo_count,
                    "pre_deploy_deployed_items": deployed_count,
                },
                indent=2,
            ),
            encoding="utf-8",
        )
        print(f"::notice::Wrote deploy summary to {summary_path}")
        PY

    - name: Upload deploy summary
      if: ${{ env.EFFECTIVE_DRY_RUN == 'false' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: fabric-deploy-summary
        path: fabric-deploy-summary.json
        if-no-files-found: ignore